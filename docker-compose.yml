services:
  postgres:
    image: postgres:17-alpine
    container_name: app_postgres
    restart: unless-stopped
    environment:
       POSTGRES_DB: app_db
       POSTGRES_USER: app_user
       POSTGRES_PASSWORD: app_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: redis_app
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: 
      context: ./api
      dockerfile: Dockerfile
    container_name: app_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://app_user:app_PASSWORD@postgres:5432/app_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: tfcvygbuhnijmtfvygbuhnjimk
    ports:
      - "5000:5000"
    networks:
      - app_network
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build: 
      context: ./client
      dockerfile: Dockerfile
    container_name: app_frontend
    restart: unless-stopped
    ports:
      - "3000:4173"
    networks:
      - app_network
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
networks:
  app_network:
    driver: bridge
